name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ clang-format
        sudo apt-get clean
    
    - name: Build (Ubuntu)
      if: runner.os == 'Linux'
      run: ./build.sh

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: ./build.bat

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install clang-format
      run: sudo apt-get install -y clang-format
    
    - name: Check formatting
      run: |
        find src -name '*.cpp' -o -name '*.hpp' | xargs clang-format -i --style=file
        git diff --exit-code

  docker:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: docker buildx build --platform linux/amd64 -t r-type .
